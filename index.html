<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8"/>
<title>Preview fade variante</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;color:#fff;}
.scene{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 16px;position:relative;overflow:hidden}
.label{position:absolute;top:16px;left:16px;font-size:12px;color:#ffc90e;text-transform:uppercase;letter-spacing:1px;font-weight:700;background:#000;padding:6px 12px;border-radius:6px;z-index:5}
.login-box{width:100%;max-width:380px;text-align:center;position:relative;z-index:2}
.logo{background:linear-gradient(135deg,#5E2989,#4a1f6e);border-radius:12px;padding:14px 18px;margin-bottom:24px;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:26px;display:inline-block}
.logo span{color:#ffc90e}
.lbl{display:block;font-size:11px;color:rgba(255,255,255,0.55);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;text-align:left}
.inp{width:100%;border:1px solid rgba(255,255,255,0.15);border-radius:10px;padding:13px 16px;color:#fff;font-family:'DM Sans',sans-serif;font-size:15px;outline:none;margin-bottom:14px;background:rgba(255,255,255,0.05)}
.btn{width:100%;padding:14px;border-radius:10px;background:#ffc90e;border:none;color:#1a1200;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px}

.a{background:linear-gradient(135deg,#454545 0%,#2f2f2f 45%,#1a1a1a 100%);}
.b{background:linear-gradient(180deg,#3d3d3d 0%,#242424 60%,#151515 100%);}
.c{background:radial-gradient(ellipse at 50% 35%,#454545 0%,#242424 55%,#151515 100%);}
.d{background:linear-gradient(160deg,#3a3a3a 0%,#2a2a2a 30%,#242424 55%,#1c1c1c 80%,#141414 100%);}
</style>
</head>
<body>

<div class="scene a">
<div class="label">A — Diagonal, colț sus-stânga mai deschis</div>
<div class="login-box">
  <div class="logo">Prime<span>School</span></div>
  <label class="lbl">Email / Username</label>
  <input class="inp" placeholder="email sau username"/>
  <label class="lbl">Parolă</label>
  <input class="inp" type="password" value="●●●●●●●●"/>
  <button class="btn">Intră în cont</button>
</div>
</div>

<div class="scene b">
<div class="label">B — Vertical, sus mai deschis, jos mai închis</div>
<div class="login-box">
  <div class="logo">Prime<span>School</span></div>
  <label class="lbl">Email / Username</label>
  <input class="inp" placeholder="email sau username"/>
  <label class="lbl">Parolă</label>
  <input class="inp" type="password" value="●●●●●●●●"/>
  <button class="btn">Intră în cont</button>
</div>
</div>

<div class="scene c">
<div class="label">C — Radial, lumină în centru, se stinge spre margini</div>
<div class="login-box">
  <div class="logo">Prime<span>School</span></div>
  <label class="lbl">Email / Username</label>
  <input class="inp" placeholder="email sau username"/>
  <label class="lbl">Parolă</label>
  <input class="inp" type="password" value="●●●●●●●●"/>
  <button class="btn">Intră în cont</button>
</div>
</div>

<div class="scene d">
<div class="label">D — Fade lung, mai multe trepte (cel mai subtil)</div>
<div class="login-box">
  <div class="logo">Prime<span>School</span></div>
  <label class="lbl">Email / Username</label>
  <input class="inp" placeholder="email sau username"/>
  <label class="lbl">Parolă</label>
  <input class="inp" type="password" value="●●●●●●●●"/>
  <button class="btn">Intră în cont</button>
</div>
</div>

</body>
</html>
