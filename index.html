<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#242424"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Prime School"/>
<link rel="apple-touch-icon" href="/icon-192.png"/>
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png"/>
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png"/>
<link rel="manifest" href="/manifest.json"/>
<title>Prime School</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="/vendor/supabase-js-2.117.2.js"></script>
<script src="/vendor/jspdf-2.5.1.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#242424;--surface:#2a2a2a;--surface2:#2f2f2f;--surface3:#383838;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.15);
  --accent:#ffc90e;--accent-text:var(--accent);--accent-dim:rgba(255,201,14,0.13);--accent-glow:rgba(255,201,14,0.07);--note:#ffffff;
  --text:#ffffff;--text2:rgba(255,255,255,0.62);--muted:rgba(255,255,255,0.32);
  --success:#38ad02;--warn:#e0b84a;--danger:#d41111;
  --display:'Cormorant Garamond',serif;--body:'DM Sans',sans-serif;
  --r:14px;--r-sm:8px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased;}
/* Dezactivam selectarea textului si meniul de "Copy / Look Up / Translate" care
   apare la tinerea apasata pe telefon (mai ales iPhone) — arata neprofesionist
   pe cifre/etichete din aplicatie (ex: XP total) si oricum nu au ce sa copieze
   elevii/parintii de acolo. Lasam selectia sa functioneze normal in campurile
   unde chiar se scrie text (input/textarea), ca sa nu stricam editarea. */
*{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}
input,textarea,[contenteditable="true"]{-webkit-touch-callout:default;-webkit-user-select:text;user-select:text;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}
#app{min-height:100vh;}

/* LOGIN */
.login-page{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 50% 0%,rgba(255,201,14,0.06) 0%,transparent 55%),linear-gradient(160deg,var(--surface3) 0%,var(--surface2) 35%,var(--bg) 100%);}
.login-box{width:100%;max-width:360px;text-align:center;}
.login-logo{font-family:var(--display);font-size:44px;font-weight:700;color:var(--accent-text);margin-bottom:4px;}
.login-logo span{color:var(--text);font-weight:400;}
.login-sub{font-size:13px;color:var(--text2);margin-bottom:36px;}
.lbl{display:block;font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
.inp{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r-sm);padding:13px 16px;color:var(--text);font-family:var(--body);font-size:15px;outline:none;margin-bottom:14px;transition:border-color 0.2s;}
.inp:focus{border-color:var(--accent);}
.login-btn{width:100%;padding:14px;border-radius:var(--r-sm);background:var(--accent);border:none;color:#1a1200;font-size:15px;font-weight:700;font-family:var(--body);cursor:pointer;margin-top:4px;}
.login-err{background:rgba(212,17,17,0.1);border:1px solid rgba(212,17,17,0.3);border-radius:var(--r-sm);padding:10px 14px;color:var(--danger);font-size:13px;margin-bottom:12px;display:none;}
/* Buton „Instalează aplicația” (pagina de login) + fereastra cu pașii */
.inst-sep{display:flex;align-items:center;gap:10px;margin:18px 0 12px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px}
.inst-sep::before,.inst-sep::after{content:"";flex:1;height:1px;background:var(--border2)}
.inst-btn{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-sm);background:rgba(255,255,255,0.03);border:1px solid var(--border2);color:var(--text);font-family:var(--body);cursor:pointer;text-align:left;transition:border-color .2s,background .2s}
.inst-btn:hover{border-color:var(--accent);background:var(--accent-glow)}
.inst-ic{width:38px;height:38px;flex:none;border-radius:10px;background:var(--accent-dim);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.inst-t{display:flex;flex-direction:column;gap:2px;flex:1}
.inst-t b{font-size:15px;font-weight:700}
.inst-t small{font-size:12px;color:var(--text2)}
.inst-arrow{color:var(--muted);font-size:18px}
.inst-ov{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:900;animation:instFade .2s}
.inst-sheet{width:100%;max-width:440px;max-height:92vh;overflow:auto;background:var(--surface);border:1px solid var(--border2);border-radius:22px 22px 0 0;padding:10px 20px calc(26px + env(safe-area-inset-bottom));animation:instUp .25s ease-out;text-align:left;color:var(--text);font-family:var(--body)}
@media(min-width:700px){.inst-ov{align-items:center}.inst-sheet{border-radius:20px;padding:20px 24px 24px}.inst-handle{display:none}}
.inst-handle{width:40px;height:4px;border-radius:2px;background:var(--border2);margin:0 auto 14px}
.inst-app{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.inst-app img{width:52px;height:52px;border-radius:12px}
.inst-app b{display:block;font-size:17px}
.inst-app small{font-size:12px;color:var(--text2)}
.inst-steps{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.inst-step{display:flex;gap:12px;align-items:flex-start;background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:12px}
.inst-n{width:24px;height:24px;flex:none;border-radius:50%;background:var(--accent);color:#1a1200;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.inst-step div{font-size:14px;line-height:1.45}
.inst-step small{display:block;color:var(--text2);font-size:12px;margin-top:2px}
.inst-glyph{display:inline-flex;vertical-align:-5px;width:22px;height:22px;border-radius:6px;background:var(--surface3);align-items:center;justify-content:center;color:#4da3ff;margin:0 2px}
.inst-msg{font-size:14px;line-height:1.5;background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:12px}
.inst-row{display:flex;gap:10px}
.inst-b2{flex:1;padding:12px;border-radius:var(--r-sm);border:1px solid var(--border2);background:transparent;color:var(--text);font-family:var(--body);font-size:14px;cursor:pointer}
.inst-b2.prim{background:var(--accent);border-color:var(--accent);color:#1a1200;font-weight:700}
@keyframes instUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes instFade{from{opacity:0}to{opacity:1}}

/* LAYOUT */
.layout{display:grid;grid-template-columns:220px 1fr;min-height:100vh;}
@media(max-width:768px){.layout{grid-template-columns:1fr;}}

/* SIDEBAR */
.sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
@media(max-width:768px){.sidebar{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;border-right:none;border-top:1px solid var(--border);z-index:50;}}
.sb-logo{padding:24px 20px 20px;border-bottom:1px solid var(--border);}
@media(max-width:768px){.sb-logo{display:none;}}
.sb-logo-text{font-family:var(--display);font-size:22px;font-weight:700;color:var(--accent-text);}
.sb-logo-text span{color:var(--text);font-weight:400;}
.sb-logo-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.nav-links{padding:12px 0;flex:1;}
@media(max-width:768px){.nav-links{display:flex;padding:0;flex:1;}}
.nav-a{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;transition:all 0.15s;border-left:2px solid transparent;color:var(--text);font-size:14px;}
.nav-a:hover{background:var(--accent-glow);color:var(--text);}
.nav-a.active{background:var(--accent-dim);color:var(--accent-text);border-left-color:var(--accent);}
@media(max-width:768px){.nav-a{flex:1;flex-direction:column;gap:2px;padding:10px 4px 14px;border-left:none;border-top:2px solid transparent;font-size:10px;text-align:center;}.nav-a.active{border-left:none;border-top-color:var(--accent);}}
.nav-icon{font-size:18px;}
@media(max-width:768px){.nav-icon{font-size:21px;}}
.sb-footer{padding:14px 20px;border-top:1px solid var(--border);}
@media(max-width:768px){.sb-footer{display:none;}}
#mobile-logout-btn{display:none;}
#mobile-acc-btn{display:none;}
@media(max-width:768px){.nav-desk{display:none!important;}}
/* pe telefon: loc in antet pentru butoanele ⚙️ si 🚪 din colt; butoanele paginii trec pe randul urmator */
@media(max-width:768px){.ph{flex-wrap:wrap;row-gap:10px;padding-right:96px!important;}}
@media(max-width:768px){
  #mobile-acc-btn{
    display:flex;align-items:center;justify-content:center;
    position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:54px;
    width:36px;height:36px;border-radius:50%;
    background:var(--surface2);border:1px solid var(--border);
    color:var(--text2,#888);font-size:16px;z-index:60;cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,0.25);
  }
}
.tch-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin-bottom:12px;}
.tch-card.off{opacity:.55;}
.tch-top{display:flex;align-items:center;gap:10px;}
.tch-av{width:38px;height:38px;border-radius:50%;background:#5e2989;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none;}
.tch-nm{font-weight:700;font-size:15px;}
.tch-em{font-size:12px;color:var(--text2);word-break:break-all;}
.tch-badge{margin-left:auto;font-size:11px;padding:3px 9px;border-radius:12px;border:1px solid var(--border2);color:var(--text2);white-space:nowrap;}
.tch-badge.admin{color:var(--accent-text);border-color:rgba(255,201,14,.5);background:var(--accent-dim);}
.tch-badge.on{color:#3ec96b;border-color:rgba(62,201,107,.4);background:rgba(62,201,107,.08);}
.tch-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;}
@media(max-width:768px){.tch-stats{grid-template-columns:repeat(2,1fr);}}
.tch-s{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:9px 10px;}
.tch-s b{display:block;font-size:20px;font-family:var(--display);}
.tch-s span{font-size:11px;color:var(--text2);line-height:1.3;display:block;margin-top:2px;}
.tch-acts{display:flex;gap:8px;margin-top:12px;}
.tch-acts button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--border2);background:transparent;color:var(--text2);font-size:12px;cursor:pointer;font-family:var(--body);}
.tch-cred{background:var(--surface2);border:1px dashed var(--accent);border-radius:12px;padding:12px;margin:12px 0;font-size:13px;line-height:1.8;word-break:break-all;}
.tch-cred code{color:var(--accent-text);font-size:14px;}
@media(max-width:768px){
  #mobile-logout-btn{
    display:flex;align-items:center;justify-content:center;
    position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;
    width:36px;height:36px;border-radius:50%;
    background:var(--surface2);border:1px solid var(--border);
    color:var(--text2,#888);font-size:16px;z-index:60;cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,0.25);
  }
}
.logout-btn{width:100%;padding:9px;border-radius:var(--r-sm);background:transparent;border:1px solid var(--border2);color:var(--text2);font-size:13px;cursor:pointer;font-family:var(--body);transition:all 0.2s;}
.logout-btn:hover{border-color:var(--danger);color:var(--danger);}

/* MAIN */
.main{overflow-y:auto;height:100vh;}
@media(max-width:768px){.main{padding-bottom:76px;}}
.ph{padding:calc(24px + env(safe-area-inset-top,0px)) 32px 18px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:10;background:var(--bg);}
@media(max-width:768px){.ph{padding:calc(18px + env(safe-area-inset-top,0px)) 16px 14px;}}
.ph-title{font-family:var(--display);font-size:26px;font-weight:700;}
@media(max-width:768px){.ph-title{font-size:20px;}}
.ph-sub{font-size:12px;color:var(--text2);margin-top:3px;}
.pb{padding:22px 32px;}
@media(max-width:768px){.pb{padding:14px 16px;}}

/* DAY TABS */
.day-tabs{display:flex;gap:6px;margin-bottom:20px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.day-tabs::-webkit-scrollbar{display:none;}
.day-tab{flex-shrink:0;padding:7px 14px;border-radius:30px;border:1px solid var(--border2);background:transparent;color:var(--text2);font-family:var(--body);font-size:13px;cursor:pointer;transition:all 0.2s;}
.day-tab:hover{border-color:var(--accent);color:var(--accent-text);}
.day-tab.active{background:var(--accent);color:#1a1200;border-color:var(--accent);font-weight:600;}
.day-tab.today-tab{border-color:var(--accent);color:var(--accent-text);}

/* SCHEDULE */
.slist{display:flex;flex-direction:column;gap:5px;}
.slot{display:flex;align-items:center;gap:14px;padding:13px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);cursor:pointer;transition:all 0.15s;position:relative;}
.slot::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;border-radius:3px 0 0 3px;transition:background 0.15s;}
.slot:hover{border-color:var(--border2);background:var(--surface2);}
.slot:hover::before{background:var(--accent);}
.slot.es{cursor:default;opacity:0.35;}
.slot.es:hover{border-color:var(--border);background:var(--surface);}
.slot.es::before{display:none;}
.slot-time{font-family:var(--display);font-size:19px;font-weight:600;color:var(--accent-text);min-width:52px;flex-shrink:0;}
.slot-name{font-size:14px;font-weight:500;flex:1;}
.slot-sub{font-size:11px;color:var(--text2);margin-top:2px;}
.slot-arr{color:var(--muted);font-size:18px;flex-shrink:0;}
.bdg{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:500;}
.bdg-ok{background:rgba(56,173,2,0.1);color:var(--success);border:1px solid rgba(56,173,2,0.2);}
.bdg-no{background:rgba(212,17,17,0.1);color:var(--danger);border:1px solid rgba(212,17,17,0.2);}

/* TODAY BANNER */
.today-banner{background:var(--accent-dim);border:1px solid rgba(255,201,14,0.25);border-radius:var(--r);padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px;}
.today-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex-shrink:0;animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}

/* STUDENTS */
.stu-row{display:flex;align-items:center;gap:14px;padding:13px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);cursor:pointer;transition:all 0.15s;margin-bottom:5px;}
.stu-row:hover{border-color:var(--border2);background:var(--surface2);}
.stu-av{width:42px;height:42px;border-radius:11px;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.cake-badge{display:inline-flex;align-items:center;justify-content:center;font-size:13px;animation:cakeBounce 1.6s ease-in-out infinite;}
@keyframes cakeBounce{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-3px) rotate(-6deg);}}

/* PROFILE */
.back-btn{display:flex;align-items:center;gap:5px;color:var(--text2);font-size:13px;cursor:pointer;padding:0;background:none;border:none;font-family:var(--body);margin-bottom:4px;}
.back-btn:hover{color:var(--accent-text);}
.ph-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.btn-prim{padding:9px 18px;border-radius:var(--r-sm);background:var(--accent);border:none;color:#1a1200;font-size:13px;font-weight:700;font-family:var(--body);cursor:pointer;}
.wa-btn{padding:9px 14px;border-radius:var(--r-sm);background:rgba(37,211,102,0.1);border:1px solid rgba(37,211,102,0.25);color:#25d166;font-size:13px;cursor:pointer;font-family:var(--body);text-decoration:none;display:inline-flex;align-items:center;gap:5px;}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px;}
.stat-c{position:relative;background:#3a3a3a;border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--r);padding:16px 16px 16px 14px;overflow:hidden;}
.stat-c::after{content:"";position:absolute;inset:0;background:radial-gradient(160px 110px at 0% 0%,rgba(0,0,0,0.32),transparent 70%);pointer-events:none;}
.stat-lbl{font-size:13.2px;color:var(--accent-text);font-weight:700;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:7px;position:relative;}
.stat-val{font-family:var(--display);font-size:33.4px;font-weight:700;position:relative;}
.stat-val.g{color:var(--accent-text);}
.stat-val.gr{color:var(--success);}
.stat-val.r{color:var(--danger);}
.sec-title{font-family:var(--display);font-size:17px;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
.sec-btn{font-family:var(--body);font-size:11px;font-weight:500;color:var(--accent-text);background:var(--accent-dim);border:none;padding:4px 10px;border-radius:20px;cursor:pointer;}

/* STREAK DOTS */
.streak-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:16px;}
.streak-legend{display:flex;gap:14px;margin-bottom:14px;flex-wrap:wrap;}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);}
.legend-dot{width:10px;height:10px;border-radius:50%;}
.streak-dots{display:flex;gap:8px;flex-wrap:wrap;}
.streak-dot{display:flex;flex-direction:column;align-items:center;gap:5px;}
.streak-circle{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;transition:transform 0.1s;}
.streak-circle.green{background:rgba(56,173,2,0.30);border:2px solid var(--success);color:var(--success);}
.streak-circle.yellow{background:rgba(224,184,74,0.15);border:2px solid var(--warn);color:var(--warn);}
.streak-circle.red{background:rgba(212,17,17,0.35);border:2px solid var(--danger);color:var(--danger);}
.streak-circle.empty{background:var(--surface3);border:2px solid var(--border);}
.streak-date{font-size:9px;color:var(--muted);}

/* ATTENDANCE STREAK */
.att-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:16px;}
.att-dots{display:flex;gap:8px;flex-wrap:wrap;}
.att-dot{display:flex;flex-direction:column;align-items:center;gap:5px;}
.att-circle{width:36px;height:36px;min-width:36px;min-height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;}
.att-circle.present{background:rgba(56,173,2,0.30);border:2px solid var(--success);color:var(--success);}
.att-circle.absent{background:rgba(212,17,17,0.35);border:2px solid var(--danger);color:var(--danger);}
.att-circle.att-empty{background:var(--surface3);border:2px solid var(--border);}
.att-date{font-size:9px;color:var(--muted);}

/* PROGRESS */
.crit-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.crit-name{font-size:12px;color:var(--text2);min-width:110px;flex-shrink:0;}
.crit-track{flex:1;height:5px;background:var(--surface3);border-radius:5px;overflow:hidden;}
.crit-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),#e8d898);}
.crit-val{font-size:12px;font-weight:600;color:var(--accent-text);min-width:28px;text-align:right;}

/* LESSONS */
.lesson-it{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.lesson-it:last-child{border-bottom:none;}
.l-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:4px;}
.l-dot.paid{background:var(--success);}
.l-dot.unpaid{background:var(--danger);}
.l-dot.absent{background:var(--muted);}
.l-date{font-size:11px;color:var(--text2);}
.l-notes{font-size:13px;margin-top:3px;line-height:1.5;}
.mark-btn{padding:3px 10px;border-radius:20px;border:1px solid var(--accent);color:var(--accent-text);background:transparent;font-size:11px;cursor:pointer;font-family:var(--body);flex-shrink:0;}

/* Butonul "Joacă" de pe cardurile de jocuri — auriu (culoarea din logo),
   cu gradient si umbre ca sa para usor ridicat/3D; la apasare "coboara". */
.game-play-btn{
  width:100%;padding:11px 0;border-radius:10px;
  background:linear-gradient(180deg,#ffe073 0%,#ffc90e 48%,#eda800 100%);
  color:#1a1200;font-weight:800;font-size:13.5px;
  display:flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid #a86f00;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,0.65),inset 0 -3px 4px rgba(120,70,0,0.35),0 3px 0 #a86f00,0 6px 10px rgba(0,0,0,0.35);
  transition:transform .12s ease,box-shadow .12s ease;
}
.game-play-btn:active{
  transform:translateY(3px);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,0.5),inset 0 -2px 3px rgba(120,70,0,0.35),0 0 0 #a86f00,0 2px 4px rgba(0,0,0,0.3);
}

/* JOC "CLAVIATURA" — claviatura de o octava, clape mereu goale, contra
   cronometru; runde de 8 note, Game Over la prima greseala. */
.clav-noteName{font-family:Georgia,serif;font-size:48px;font-weight:900;color:var(--accent-text);line-height:1;transition:transform .15s;}
.clav-noteName.pop{animation:clavPop .35s cubic-bezier(.2,.8,.2,1);}
@keyframes clavPop{0%{transform:scale(0.6);opacity:0;}60%{transform:scale(1.15);}100%{transform:scale(1);opacity:1;}}
.clav-timerTrack{height:8px;background:var(--surface3);border-radius:8px;overflow:hidden;margin-bottom:20px;}
.clav-timerFill{height:100%;border-radius:8px;background:var(--success);transition:width 0.1s linear, background 0.3s;}
.clav-keyboard{position:relative;height:150px;display:flex;margin:0 auto;max-width:360px;user-select:none;}
.clav-wkey{flex:1;background:linear-gradient(180deg,#fdfdfd,#e8e8e8);border:1px solid #999;border-radius:0 0 6px 6px;position:relative;cursor:pointer;transition:background .15s;margin-right:1px;}
.clav-wkey:last-child{margin-right:0;}
.clav-wkey.pressed-correct{background:linear-gradient(180deg,#9df5b8,#3ec96b)!important;}
.clav-wkey.pressed-wrong{background:linear-gradient(180deg,#f7a8a8,#d41111)!important;}
.clav-wkey.pressed-timeout{background:linear-gradient(180deg,#9df5b8,#3ec96b)!important;}
.clav-bkey{position:absolute;top:0;width:9.5%;height:62%;background:linear-gradient(180deg,#3a3a3a,#0c0c0c);border-radius:0 0 4px 4px;z-index:2;cursor:pointer;transition:background .15s;}
.clav-bkey.pressed-correct{background:linear-gradient(180deg,#3ec96b,#1f7a3d)!important;}
.clav-bkey.pressed-wrong{background:linear-gradient(180deg,#d41111,#7a0d0d)!important;}
.clav-bkey.pressed-timeout{background:linear-gradient(180deg,#3ec96b,#1f7a3d)!important;}

/* NOTIFICARI — swipe to dismiss */
.swipe-row{position:relative;margin-bottom:10px;border-radius:var(--r);overflow:hidden;transition:max-height 0.3s ease,margin 0.3s ease;}
.swipe-row.removed{max-height:0;margin-bottom:0;}
.swipe-bg{position:absolute;inset:0;background:linear-gradient(90deg,rgba(212,17,17,0.12),rgba(212,17,17,0.3));display:flex;align-items:center;justify-content:flex-end;padding:0 20px;font-size:20px;pointer-events:none;}
.swipe-bg.swipe-bg-l{justify-content:flex-start;}
.swipe-card{position:relative;touch-action:pan-y;cursor:grab;will-change:transform,opacity;transition:transform 0.25s cubic-bezier(.2,.8,.2,1),opacity 0.25s ease,padding 0.3s ease,border-width 0.3s ease;}
.swipe-card:active{cursor:grabbing;}
@keyframes notifHl{0%{box-shadow:0 0 0 0 rgba(255,201,14,.7);background:rgba(255,201,14,.18);}70%{box-shadow:0 0 0 10px rgba(255,201,14,0);}100%{box-shadow:0 0 0 0 rgba(255,201,14,0);}}
.swipe-card.notif-hl{border-color:rgba(255,201,14,.7)!important;animation:notifHl 2.4s ease-out .5s 1;}
.swipe-row.removed .swipe-card{padding:0!important;border-width:0!important;opacity:0;max-height:0;overflow:hidden;}

/* MODAL */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);}
@media(min-width:769px){.modal-ov{align-items:center;}}
.modal{background:var(--surface);border-radius:20px 20px 0 0;padding:22px 22px 40px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;border-top:1px solid var(--border2);}
@media(min-width:769px){.modal{border-radius:20px;border:1px solid var(--border2);}}
.modal-handle{width:36px;height:3px;background:var(--border2);border-radius:2px;margin:0 auto 18px;}
@media(min-width:769px){.modal-handle{display:none;}}
.modal-title{font-family:var(--display);font-size:20px;font-weight:700;margin-bottom:14px;}
.field{margin-bottom:13px;}
.field label{display:block;font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;}
.field input,.field select,.field textarea{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r-sm);padding:10px 14px;color:var(--text);font-family:var(--body);font-size:14px;outline:none;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);}
.field textarea{resize:none;height:85px;}
.tog-row{display:flex;gap:7px;margin-bottom:13px;}
.tog{flex:1;padding:9px;border-radius:var(--r-sm);border:1px solid var(--border2);background:transparent;color:var(--text2);font-size:13px;cursor:pointer;font-family:var(--body);text-align:center;transition:all 0.15s;}
.tog.on-ok{background:rgba(56,173,2,0.12);border-color:var(--success);color:var(--success);}
.tog.on-no{background:rgba(212,17,17,0.12);border-color:var(--danger);color:var(--danger);}
.m-actions{display:flex;gap:8px;margin-top:6px;}
.m-prim{flex:2;padding:13px;border-radius:var(--r-sm);background:var(--accent);border:none;color:#1a1200;font-size:14px;font-weight:700;font-family:var(--body);cursor:pointer;}
.m-sec{flex:1;padding:13px;border-radius:var(--r-sm);background:transparent;border:1px solid var(--border2);color:var(--text2);font-size:14px;font-family:var(--body);cursor:pointer;}

/* ELEV PAGE */
.elev-wrap{max-width:430px;margin:0 auto;min-height:100vh;}
.elev-wrap *{overflow-wrap:break-word;word-break:break-word;}
.elev-hero{background:linear-gradient(160deg,var(--surface3) 0%,var(--surface2) 55%,var(--bg) 100%);padding:52px 24px 28px;border-bottom:1px solid var(--border);}
.elev-logo{font-family:var(--display);font-size:36px;font-weight:700;color:var(--accent-text);margin-bottom:8px;}.elev-logo span{color:var(--text);font-weight:400;}
.elev-name{font-family:var(--display);font-size:26px;font-weight:700;color:var(--text);}
.elev-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
@media(min-width:768px){
  .elev-hero{width:100vw;position:relative;left:50%;margin-left:-50vw;box-sizing:border-box;}
  .elev-hero>*{max-width:700px;margin-left:auto;margin-right:auto;}
}
@media(min-width:768px) and (max-width:1099px){
  .elev-wrap{max-width:700px !important;width:100% !important;margin:0 auto !important;}
  .elev-hero{padding:32px 6vw 24px;}
  .elev-body{padding:28px 5vw;}
}
@media(pointer:coarse) and (min-width:768px){
  .practice-card{padding:26px;}
  .practice-title{font-size:22px;}
  .practice-sub{font-size:15px;}
  .prac-status{padding:16px 18px;font-size:16px;gap:14px;}
  .prac-status span{font-size:30px !important;}
  .prac-btn{font-size:16px;padding:16px 20px;}
  .login-box{max-width:460px;}
  .lbl{font-size:14px;}
  .inp{padding:17px 20px;font-size:19px;margin-bottom:18px;}
  .login-btn{padding:18px;font-size:19px;}
  .login-logo-svg{max-width:420px !important;}
}
@media(min-width:1100px){
  .login-box{max-width:480px;}
  .lbl{font-size:14px;}
  .inp{padding:17px 20px;font-size:19px;margin-bottom:18px;}
  .login-btn{padding:18px;font-size:19px;}
  .login-logo-svg{max-width:440px !important;}
}
@media(min-width:1100px){
  .elev-wrap{max-width:100% !important;width:100% !important;margin:0 !important;}
  .elev-hero{padding:32px 6vw 24px;}
  .elev-hero>*{max-width:900px;}
  .elev-body{padding:28px 6vw;}
  .elev-grid{display:grid !important;grid-template-columns:1fr 1fr;gap:24px;align-items:start;}
  .elev-col{display:flex;flex-direction:column;gap:16px;}
}
.elev-chip{padding:3px 10px;border-radius:20px;border:1px solid rgba(255,201,14,0.25);background:rgba(255,201,14,0.08);color:var(--accent-text);font-size:11px;}
.elev-body{padding:20px;}

/* PRACTICE BUTTONS */
.practice-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:16px;}
.practice-card.needs-attention{border-color:rgba(255,201,14,0.5);animation:pulseGlow 2.2s ease-in-out infinite;}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(255,201,14,0.35);}50%{box-shadow:0 0 0 10px rgba(255,201,14,0);}}
@keyframes noteWiggle{0%,100%{transform:rotate(0deg);}20%{transform:rotate(-12deg);}40%{transform:rotate(10deg);}60%{transform:rotate(-8deg);}80%{transform:rotate(6deg);}}
.wiggle-icon{display:inline-flex;animation:noteWiggle 1.6s ease-in-out infinite;transform-origin:70% 90%;}
.practice-title{font-family:var(--display);font-size:18px;font-weight:700;margin-bottom:4px;}
.practice-sub{font-size:12px;color:var(--text2);margin-bottom:16px;}
.practice-btns{display:flex;flex-direction:column;gap:10px;}
.prac-btn{width:100%;padding:14px 18px;border-radius:var(--r);border:none;font-size:14px;font-weight:700;font-family:var(--body);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:all 0.2s;}
.prac-btn.clip{background:rgba(56,173,2,0.12);border:1.5px solid var(--success);color:var(--success);}
.prac-btn.done{opacity:0.6;cursor:default;}
.prac-status{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px 14px;display:flex;align-items:center;gap:10px;font-size:13px;}

/* TOAST */
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 20px);left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--success);color:var(--success);padding:9px 18px;border-radius:30px;font-size:13px;z-index:999;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity 0.3s;}
#toast.show{opacity:1;}
.empty{text-align:center;padding:40px 20px;color:var(--text2);}
select option{background:var(--surface2);}

@keyframes shake {
  0%,100% { transform: translateX(0); }
  20%      { transform: translateX(-8px); }
  40%      { transform: translateX(8px); }
  60%      { transform: translateX(-6px); }
  80%      { transform: translateX(6px); }
}

/* Palmares — cartonase de medalie cu dungi in degrade + medalie stralucitoare */
.palm-card{
  position:relative;
  display:flex;align-items:center;gap:16px;
  padding:18px;
  border-radius:16px;
  margin-bottom:12px;
  overflow:hidden;
  isolation:isolate;
  background:var(--surface2);
  border:1px solid var(--border2);
}
.palm-card::before{
  content:"";
  position:absolute;inset:0;
  background-image:repeating-linear-gradient(
    120deg,
    var(--stripe) 0px, var(--stripe) 10px,
    transparent 10px, transparent 24px
  );
  -webkit-mask-image:linear-gradient(100deg, black 0%, black 25%, transparent 75%);
  mask-image:linear-gradient(100deg, black 0%, black 25%, transparent 75%);
  z-index:0;
}
.palm-medal{
  position:relative;z-index:1;flex-shrink:0;
  width:54px;height:54px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:28px;
  background:radial-gradient(circle at 35% 30%, var(--glow2) 0%, var(--glow1) 60%, transparent 100%);
  box-shadow:0 0 22px var(--glow1), inset 0 0 0 2px var(--ring);
}
.palm-info{position:relative;z-index:1;flex:1;min-width:0}
.palm-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.6px;color:var(--main)}
.palm-month{font-size:13px;color:var(--text2);margin-top:3px}
.palm-xp{
  position:relative;z-index:1;flex-shrink:0;font-size:15px;font-weight:800;color:var(--main);
  text-shadow:0 0 14px var(--glow1);
}
/* Joc "Acord pe portativ" — acordurile sunt SVG-uri pre-randate cu LilyPond
   (gravura reala, nu desenate manual), fara width/height proprii — dimensiunea
   se controleaza de aici, iar culoarea (alb/verde/rosu la raspuns) vine din
   currentColor, mostenita din style="color:..." pus pe acest container. */
.acp-staff svg{height:90px;width:auto;display:block}
.acp-lvlRow{display:flex;justify-content:center;gap:14px;margin-top:28px;flex-wrap:wrap}
.acp-lvlSq{
  width:100px;height:100px;border-radius:18px;background:var(--surface2);
  border:1px solid var(--border2);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;cursor:pointer;
  font-family:var(--body);transition:transform .15s, border-color .15s, background .15s;
}
.acp-lvlSq:hover{transform:translateY(-3px)}
.acp-lvlSq.easy:hover{border-color:#3ec96b;background:rgba(62,201,107,0.08)}
.acp-lvlSq.medium:hover{border-color:#ffc90e;background:rgba(255,201,14,0.08)}
.acp-lvlSq.hard:hover{border-color:#d41111;background:rgba(212,17,17,0.08)}
/* Selector "cheie" din jocul "Recunoaste nota" — patratele cu chei gravate
   real cu LilyPond (nu emoji), acelasi stil compact ca la nivelurile de la
   "Acord pe portativ". Fondul galben la selectie e un strat separat (::before,
   z-index:0) pus STRICT sub desen si sub text (z-index:1), ca sa nu para un
   "filtru" peste cheie. */
.clefRow{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.clefSq{
  position:relative;width:100px;height:100px;border-radius:18px;background:var(--surface2);
  border:1px solid var(--border2);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;cursor:pointer;color:#ede8e0;
  font-family:var(--body);transition:transform .15s, border-color .15s;
}
.clefSq:hover{transform:translateY(-3px)}
.clefSq.active{border-color:var(--accent)}
.clefSq.active::before{content:"";position:absolute;inset:0;border-radius:17px;background:var(--accent-dim);z-index:0}
.clefSq .clefIcon,.clefSq .clefLabel{position:relative;z-index:1}
.clefSq .clefIcon{height:34px;display:flex;align-items:center;justify-content:center}
.clefSq .clefIcon svg{height:34px;width:auto}
.clefSq .clefIcon.both svg{height:44px}
.clefSq .clefLabel{font-size:13px;font-weight:800;color:var(--text2)}
.clefSq.active .clefLabel{color:var(--accent-text)}

/* post-it-uri (Acasa) */
.pi-board{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:26px 20px;padding:6px 2px 10px}
.pi{position:relative;min-height:170px;padding:24px 14px 12px;color:#2b2b2b;border-radius:2px 2px 4px 18px/2px 2px 4px 10px;box-shadow:0 12px 18px -8px rgba(0,0,0,.55),inset 0 -14px 20px -16px rgba(0,0,0,.25);transition:transform .2s,opacity .3s;display:flex;flex-direction:column}
.pi:hover{transform:rotate(0) scale(1.03)!important;z-index:2}
.pi::before{content:"";position:absolute;top:-9px;left:50%;width:74px;height:20px;transform:translateX(-50%) rotate(-2deg);background:rgba(255,255,255,.3);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.pi-t{font-family:'Caveat',cursive;font-size:25px;line-height:1.05;font-weight:700;word-break:break-word;white-space:pre-wrap;padding-right:14px}
.pi-m{margin-top:auto;padding-top:10px;font-size:11.5px;display:flex;flex-wrap:wrap;gap:4px}
.pi-bd{background:rgba(0,0,0,.09);border-radius:10px;padding:2px 8px;font-weight:600}.pi-late{background:#c62828;color:#fff}
.pi-a{display:flex;gap:6px;margin-top:10px}
.pi-a button{flex:1;border:none;border-radius:8px;padding:7px 4px;font:600 12px var(--body);cursor:pointer;background:rgba(0,0,0,.1);color:#2b2b2b}
.pi-a button:hover{background:rgba(0,0,0,.18)}
.pi-x{position:absolute;top:6px;right:6px;border:none;background:transparent;color:rgba(0,0,0,.35);font-size:14px;cursor:pointer;padding:4px 6px;line-height:1}
.pi-x:hover{color:#c62828}
.pi.done{opacity:.45}.pi.done .pi-t{text-decoration:line-through}
.pi-li{display:flex;gap:8px;align-items:flex-start;font-family:'Caveat',cursive;font-size:21px;line-height:1.1;cursor:pointer;margin:3px 0}
.pi-li.d span:nth-child(2){text-decoration:line-through;opacity:.5}
.pi-bx{width:16px;height:16px;border:2px solid #2b2b2b;border-radius:3px;flex:none;margin-top:4px;font:800 11px var(--body);display:flex;align-items:center;justify-content:center}
.pi-rm{opacity:0;font:12px var(--body);color:rgba(0,0,0,.45);padding:3px}.pi-li:hover .pi-rm{opacity:1}
@media(hover:none){.pi-rm{opacity:.6}}
.pi-in{background:transparent;border:none;border-bottom:1.5px dashed rgba(0,0,0,.3);font-family:'Caveat',cursive;font-size:20px;width:100%;outline:none;color:#2b2b2b;margin-top:6px}
.pi-in::placeholder{color:rgba(0,0,0,.4)}
.pi-chip{padding:6px 12px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--text2);font-size:12px;cursor:pointer;font-family:var(--body)}
.pi-chip.on{background:rgba(255,201,14,.14);border-color:var(--accent);color:var(--accent-text)}
@media(max-width:520px){.pi-board{grid-template-columns:1fr 1fr;gap:20px 12px}.pi{min-height:150px;padding:22px 10px 10px}.pi-t{font-size:21px}}

/* joc Major sau minor */
.mm-stage{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:24px 16px;text-align:center}
.mm-play{width:116px;height:116px;border-radius:50%;border:none;background:var(--accent);color:#0a0a0c;font-size:42px;cursor:pointer;box-shadow:0 10px 30px -10px rgba(255,201,14,.7);position:relative;transition:transform .15s}
.mm-play:active{transform:scale(.94)}
.mm-play.pulse::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--accent);animation:mmPulse 1s ease-out infinite}
@keyframes mmPulse{from{opacity:.9;transform:scale(.9)}to{opacity:0;transform:scale(1.3)}}
.mm-keys{display:flex;justify-content:center;margin:16px auto 0;height:64px;position:relative;width:max-content}
.mm-wk{width:14px;height:64px;background:#f4f4f4;border:1px solid #999;border-radius:0 0 4px 4px;margin-right:-1px;transition:background .1s}
.mm-bk{position:absolute;width:9px;height:40px;background:#1b1b1b;border-radius:0 0 3px 3px;z-index:2;transition:background .1s}
.mm-wk.hit{background:var(--accent)}.mm-bk.hit{background:#d9a400}
.mm-ans{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.mm-ans button{padding:20px 8px;border-radius:18px;border:none;font:800 19px var(--body);cursor:pointer;color:#0a0a0c;transition:transform .12s,opacity .2s}
.mm-ans button:active{transform:scale(.96)}.mm-ans small{display:block;font-size:12px;font-weight:500;margin-top:4px;opacity:.75}
.mm-maj{background:#ffb020}.mm-min{background:#5b8def;color:#fff!important}
.mm-ans button.dim{opacity:.3}.mm-ans button.right{outline:4px solid #3ecf8e;outline-offset:3px}.mm-ans button.wrong{outline:4px solid #e05252;outline-offset:3px}
.mm-dot{width:9px;height:9px;border-radius:50%;background:var(--surface2);border:1px solid var(--border2)}
.mm-dot.ok{background:#3ecf8e;border-color:#3ecf8e}.mm-dot.bad{background:#e05252;border-color:#e05252}.mm-dot.cur{border-color:var(--accent);box-shadow:0 0 0 2px rgba(255,201,14,.3)}
.mm-next{padding:13px 24px;border-radius:12px;border:none;background:var(--accent);color:#1a1200;font:800 15px var(--body);cursor:pointer}
.mm-lv{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:end}

html.ui-light{--bg:#f3f1ec;--surface:#ffffff;--surface2:#f6f4f0;--surface3:#ebe8e2;--border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.15);--accent:#d9a400;--accent-text:#94690a;--success:#2a8a00;--warn:#a07400;--danger:#c40e0e;--accent-dim:rgba(217,164,0,0.15);--accent-glow:rgba(217,164,0,0.08);--note:#1d1d1d;--text:#1d1d1d;--text2:rgba(0,0,0,0.6);--muted:rgba(0,0,0,0.52);color-scheme:light}

html.ui-light .stat-c{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.04)}

.ui-gear{display:flex;align-items:center;justify-content:center;gap:7px;width:calc(100% - 32px);margin:0 16px 8px;padding:8px 10px;border-radius:var(--r-sm);background:transparent;border:1px solid var(--border2);color:var(--text2);font-size:12px;cursor:pointer;font-family:var(--body)}
.ui-gear svg{width:15px;height:15px}
.ui-ov{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:flex-start;padding:16px}
.ui-card{width:320px;max-width:100%;background:var(--surface);color:var(--text);border:1px solid var(--border2);border-radius:18px;padding:16px;box-shadow:0 20px 50px rgba(0,0,0,.45);font-family:var(--body);margin:0 0 70px 8px}
.ui-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ui-h b{font-family:var(--display);font-size:22px}
.ui-x{width:30px;height:30px;border-radius:50%;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;font-size:14px}
.ui-lbl{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.8px;margin:6px 0 8px}
.ui-row{display:flex;gap:6px;align-items:center;margin-bottom:10px}
.ui-row input[type=range]{flex:1;accent-color:var(--accent)}
.ui-pm{width:34px;height:34px;border-radius:10px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);font:700 18px var(--body);cursor:pointer;line-height:1}
.ui-pct{min-width:46px;text-align:right;font-weight:800;font-size:14px}
.ui-seg{flex:1;padding:10px 6px;border-radius:10px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);font:600 12.5px var(--body);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.ui-seg svg{width:18px;height:18px}
.ui-seg.on{border-color:var(--accent);background:var(--accent-dim);color:var(--accent-text);font-weight:700}
.ui-note{font-size:11px;color:var(--muted);line-height:1.45;margin-top:4px}
